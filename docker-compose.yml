services:
  app:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hotel_kong_arthur}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_local_password}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  db:
    image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_kong_arthur}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -v ON_ERROR_STOP=1 -Atqc \"SELECT 1\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  test-db:
    image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    profiles: [test]
    environment:
      POSTGRES_DB: hotel_kong_arthur_test
      POSTGRES_USER: hotel_test_user
      POSTGRES_PASSWORD: hotel_test_password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -v ON_ERROR_STOP=1 -Atqc \"SELECT 1\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  test:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      DB_HOST: test-db
      DB_PORT: 5432
      POSTGRES_DB: hotel_kong_arthur_test
      POSTGRES_USER: hotel_test_user
      POSTGRES_PASSWORD: hotel_test_password
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
