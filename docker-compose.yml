services:
  app:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_kong_arthur}
      MYSQL_USER: ${MYSQL_USER:-hotel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_local_password}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  db:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    container_name: hotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hotel_local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_kong_arthur}
      MYSQL_USER: ${MYSQL_USER:-hotel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_local_password}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -Nse \"SELECT 1\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  test-db:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    profiles: [test]
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: hotel_kong_arthur_test
      MYSQL_USER: hotel_test_user
      MYSQL_PASSWORD: hotel_test_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -Nse \"SELECT 1\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  test:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      DB_HOST: test-db
      DB_PORT: 3306
      MYSQL_DATABASE: hotel_kong_arthur_test
      MYSQL_USER: hotel_test_user
      MYSQL_PASSWORD: hotel_test_password
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  mysql_data:
